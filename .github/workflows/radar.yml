name: Atualizar radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/radar.py"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe
        run: python -m py_compile scripts/radar.py

      - name: Rodar radar
        run: python scripts/radar.py

      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/jobs.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(data.get("jobs"), list)
          assert isinstance(data.get("errors"), list)
          assert data.get("updated_at")
          print(f"OK: {len(data['jobs'])} oportunidades; erros: {len(data['errors'])}")
          PY

      - name: Salvar atualização
        run: |
          git config user.name "jarvis-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Atualiza radar de oportunidades"
            git push
          fi
