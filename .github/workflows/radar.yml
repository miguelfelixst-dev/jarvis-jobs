name: Atualizar radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar radar
        run: python scripts/radar.py

      - name: Salvar atualização
        run: |
          git config user.name "jarvis-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Atualiza radar de oportunidades"
            git push
          fi
