name: Atualizar radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/radar.py"
      - "tests/test_radar.py"
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Validar sintaxe
        run: python -m py_compile scripts/radar.py tests/test_radar.py

      - name: Rodar testes
        run: python -m unittest tests/test_radar.py -v

      - name: Rodar radar
        run: python scripts/radar.py

      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data/jobs.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("jobs"), list)
          assert isinstance(data.get("errors"), list)
          assert data.get("updated_at")
          assert data.get("count") == len(data.get("jobs"))
          print(f"OK: {len(data['jobs'])} oportunidades; erros de fonte: {len(data['errors'])}")
          PY

      - name: Salvar atualização
        run: |
          git config user.name "jarvis-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Atualiza radar de oportunidades"
            git push
          fi
